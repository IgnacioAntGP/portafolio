<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet - Depositar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styleWallet.css">
</head>
<body>
  <header class="container-fluid text-center py-4 border-bottom">
    <h1>Depositar</h1>
  </header>

  <main>
    <div class="container my-4">
    <form action="" method="post" name="deposit-form" id="deposit-form">
      <div class="card">
        <div class="card-header">
          <p>Saldo actual:</p>
          <span id="balance"></span>
        </div>
        <div class="card-body p-4">
          <label for="depositAmount" class="form-label">Monto a depositar:</label>
          <input type="number" class="form-control my-2" id="depositAmount" placeholder="Ingrese monto mínimo de $1000">
          
          <div class="row g-2">
            <div class="col-md-6 col-lg-12">
              <button type="submit" class="btn my-2 btn-primary w-100">Realizar depósito</button>
            </div>
            <div class="col-md-6 col-lg-12">
              <a href="menu.html" class="btn my-2 btn-secondary w-100" id="volverMenuBtn">Volver al Menú Principal</a>
            </div>
          </div>
        </div>
      </div>
    </form>
    </div>
  </main>

  <footer class="container-fluid text-center py-3 border-top">
    <p>&copy; 2026 Wallet. Todos los derechos reservados.</p>
  </footer>

  <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/proyectos/wallet/js/main.js" type="module"></script>
    <script src="/proyectos/wallet/js/deposit.js" type="module"></script>
</body>
</html>
