<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wallet - Menú Principal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/proyectos/wallet/css/styleWallet.css">
</head>
<body>
  <header class="container text-center py-4 border-bottom">
    <h1>Menú Principal</h1>
  </header>
  <main class="container my-4">
    <!-- Card para mostrar el saldo en cuenta -->
    <div class="card">
      <div class="card-body text-center p-4 mb-4 mx-auto" style="max-width: 500px;">
        <label for="balance" class="text-uppercase mb-1">Dinero en cuenta</label>
        <div>
          <data value="60000" id="balance" name="balance" class="fw-bold">$60.000</data>
        </div>
      </div>
    </div>
    <!-- Sección de Botones -->
    <div class="row g-3 justify-content-center mt-1">
      <div class="col-12 col-sm-6 col-lg-auto">
        <a href="/proyectos/wallet/deposit/" class="btn btn-primary w-100 py-2 link-navegacion">Depositar</a>
      </div>
      
      <div class="col-12 col-sm-6 col-lg-auto">
        <a href="/proyectos/wallet/sendmoney/" class="btn btn-success w-100 py-2 link-navegacion">Enviar Dinero</a>
      </div>
      
      <div class="col-12 col-sm-6 col-lg-auto">
        <a href="/proyectos/wallet/transactions/" class="btn btn-info w-100 py-2 link-navegacion">Últimos Movimientos</a>
      </div>
      
      <div class="col-12 col-sm-6 col-lg-auto">
        <a href="/proyectos/wallet/login/" class="btn btn-secondary w-100 py-2 logout">Cerrar Sesión</a>
      </div>
    </div>
    <div id="contenedor-alerta"></div>
  </main>
  <footer class="container-fluid text-center py-3 border-top">
    <p>&copy; 2026 Wallet App. Todos los derechos reservados.</p>
  </footer>
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/proyectos/wallet/js/main.js" type="module"></script>
    <script src="/proyectos/wallet/js/menu.js" type="module"></script>
</body>
</html>
