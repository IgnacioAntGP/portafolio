<!DOCTYPE html>
<html>
<head>
  <title>Wallet - Enviar Dinero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styleWallet.css">
</head>
<body>
  <header class="container-fluid text-center py-4 border-bottom">
    <h1>Enviar Dinero</h1>
  </header>

  <main>
    <div class="container my-4">
        <div class="form-group">
          <label for="searchContact" class="form-label">Buscar en la agenda de transferencias:</label>
          <input type="text" class="form-control" id="searchContact" placeholder="Buscar por contacto">
        </div>
        <button type="button" class="btn btn-success my-3" data-bs-toggle="modal" data-bs-target="#modalContacto">
          Agregar nuevo contacto
        </button>

        <!-- Lista de contactos -->
          <div class="card-header">
            <h3>Contactos</h3>
          </div>
          <div class="card-body">
            <ul id="contactList" class="list-group"></ul>
          </div>
        </div>
        <div class="container">
          <button type="submit" class="btn btn-primary my-2" id="sendMoneyBtn" data-bs-toggle="modal" data-bs-target="#modalEnvio">Enviar dinero</button>
          <a href="menu.html" class="btn btn-secondary my-2" id="volverMenuBtn">Volver al Menú Principal</a>
        </div>

    <!-- Modal para formulario de ingreso de nuevo contacto -->
      <div class="modal fade" id="modalContacto" tabindex="-1" aria-labelledby="modalContactoLabel">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fs-5" id="modalContactoLabel">Agregar nuevo contacto</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" aria-hidden="false"></button>
            </div>
            <div class="modal-body">
              <!-- Formulario para ingresar nuevo contacto -->
              <form action="" method="post" name="newContact-form" id="newContact-form">
                <!-- Campos: nombre, CBU, alias, banco -->
                <div class="form-group">
                  <label for="contactName" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="contactName" placeholder="Ingrese el nombre del contacto">
                </div>
                <div class="form-group">
                  <label for="contactCBU" class="form-label">CBU</label>
                  <input type="text" class="form-control" id="contactCBU" placeholder="Ingrese el CBU del contacto">
                </div>
                <div class="form-group">
                  <label for="contactAlias" class="form-label">Alias (opcional)</label>
                  <input type="text" class="form-control" id="contactAlias" placeholder="Ingrese el alias del contacto">
                </div>
                <div class="form-group">
                  <label for="contactBank" class="form-label">Banco</label>
                  <select class="form-select" id="contactBank">
                    <option value="" selected disabled>Seleccione un banco</option>
                    </select>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="button" class="btn btn-primary" id="newContactForm-submitBtn">Guardar contacto</button>
            </div>
          </div>
        </div>
      </div>

          <!-- Modal para formulario de envío de dinero -->
      <div class="modal fade" id="modalEnvio" tabindex="-1" aria-labelledby="modalEnvioLabel">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fs-5" id="modalEnvioLabel">Contacto: [INSERTAR NOMBRE]</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" aria-hidden="false"></button>
            </div>
            <div class="modal-body">
              <!-- Formulario para envío -->
              <form action="" method="post" name="sendMoney-form" id="sendMoney-form">
                <!-- Campos desactivados: nombre, CBU, alias, banco; Campo activado: Dinero -->
                <fieldset id="contactDetailsPreview" disabled>
                  <div class="form-group"></div>
                </fieldset>
                <div class="form-group">
                  <label for="sendMoneyAmount" class="form-label">Monto:</label>
                  <input type="number" class="form-control" id="sendMoneyAmount" placeholder="Ingrese monto mayor a $1.000">
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="button" class="btn btn-primary" id="confirmSendMoneyBtn">Confirmar</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="container-fluid text-center py-3 border-top">
    <p>&copy; 2026 Wallet App. Todos los derechos reservados.</p>
  </footer>

  <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/proyectos/wallet/js/main.js" type="module"></script>
    <script src="/proyectos/wallet/js/sendmoney.js" type="module"></script>
</body>
</body>
</html>
